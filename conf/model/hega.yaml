name: hega
backbone: HeteroGCN # [GCN, GAT, HeteroGCN]
backbone_norm: layer_norm
num_neigh: -1
hid_dim: 256
z_dim: 256
num_layers: 2
n_clusters: 10
alpha: 1.0
sigmoid_s: false

attr_loss_weight: 1.0 # [0.0, 1.0]
has_annealing: false   # [true, false]
attr_reg_base: 1e-2
attr_warmup_ratios: 0.0
clustering_weight: 1.0  # [0.0, 1.0]

struct_loss_weight: 1.0 # [0.0, 1.0]
bce_weight: 0.0         # [0.0, 1.0]
ranking_weight: 1.0     # [0.0, 1.0]
dice_weight: 1.0        # [0.0, 1.0]
misleading_weight: 1e-5
kl_weight: 1e-5
pos_loss_weight: 1.0
neg_loss_weight: 5.0
ranking_margin: 1.0

neighbor_constrain_weight: 1.0 # [0.0, 0.1]

lambda_attr_recon: 0.165        # []
lambda_clustering_recon: 0.165
lambda_struct_recon: 0.33
lambda_neighbor_recon: 0.33
lambda_attr_unc: 0.33
lambda_clustering_unc: 0.33
lambda_struct_unc: 0.33
lambda_recon: 0.4
lambda_unc: 0.6

anomaly_func_type: gate # ["gate"]