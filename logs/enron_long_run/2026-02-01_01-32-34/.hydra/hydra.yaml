hydra:
  run:
    dir: logs/${exp_name}/${now:%Y-%m-%d}_${now:%H-%M-%S}
  sweep:
    dir: logs/${exp_name}/${now:%Y-%m-%d}_${now:%H-%M-%S}
    subdir: ${model.name}_${optimizer.name}_lr${optimizer.lr}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - dataset=enron
    - exp_name=enron_long_run
    - epoch=500
    - optimizer.lr=0.01
    - gpu=0
    - model.hid_dim=128
    - model.z_dim=128
    - model.attr_loss_weight=1.0
    - model.has_annealing=true
    - model.attr_reg_base=1e-5
    - model.attr_warmup_ratios=0.7
    - model.clustering_weight=1.0
    - model.n_clusters=10
    - model.struct_loss_weight=2.0
    - model.bce_weight=0.0
    - model.ranking_weight=1.0
    - model.dice_weight=0.0
    - model.misleading_weight=1e-3
    - model.pos_loss_weight=1.0
    - model.neg_loss_weight=5.0
    - model.kl_weight=1e-5
    - model.neighbor_constrain_weight=1e-2
    - model.anomaly_func_type=gate
    - model.lambda_attr_recon=0.165
    - model.lambda_clustering_recon=0.165
    - model.lambda_struct_recon=0.33
    - model.lambda_neighbor_recon=0.33
    - model.lambda_attr_unc=0.33
    - model.lambda_clustering_unc=0.33
    - model.lambda_struct_unc=0.33
    - model.lambda_recon=0.4
    - model.lambda_unc=0.6
  job:
    name: main
    chdir: true
    override_dirname: dataset=enron,epoch=500,exp_name=enron_long_run,gpu=0,model.anomaly_func_type=gate,model.attr_loss_weight=1.0,model.attr_reg_base=1e-5,model.attr_warmup_ratios=0.7,model.bce_weight=0.0,model.clustering_weight=1.0,model.dice_weight=0.0,model.has_annealing=true,model.hid_dim=128,model.kl_weight=1e-5,model.lambda_attr_recon=0.165,model.lambda_attr_unc=0.33,model.lambda_clustering_recon=0.165,model.lambda_clustering_unc=0.33,model.lambda_neighbor_recon=0.33,model.lambda_recon=0.4,model.lambda_struct_recon=0.33,model.lambda_struct_unc=0.33,model.lambda_unc=0.6,model.misleading_weight=1e-3,model.n_clusters=10,model.neg_loss_weight=5.0,model.neighbor_constrain_weight=1e-2,model.pos_loss_weight=1.0,model.ranking_weight=1.0,model.struct_loss_weight=2.0,model.z_dim=128,optimizer.lr=0.01
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /data/baisongran/evidential-graph-anomaly
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /data/baisongran/evidential-graph-anomaly/conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /data/baisongran/evidential-graph-anomaly/logs/enron_long_run/2026-02-01_01-32-34
    choices:
      dataset: enron
      optimizer: adam
      model: hega
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
